name: Discord Changelog

on:
  push:
    branches:
      - main

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get commit changes
        id: changes
        run: |
          git diff --numstat HEAD^ HEAD > changes.txt

      - name: Send changelog to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          changes = []

          with open("changes.txt", encoding="utf-8") as f:
              for line in f:
                  parts = line.rstrip().split("\t")

                  if len(parts) != 3:
                      continue

                  additions, deletions, filename = parts

                  # Git иногда возвращает "-" вместо числа
                  if additions == "-":
                      additions = "0"

                  if deletions == "-":
                      deletions = "0"

                  changes.append(
                      f"`{filename}`  **+{additions} -{deletions}**"
                  )

          if not changes:
              changes.append("No file changes")

          description = "\n".join(changes)

          # Discord embed description ограничен 4096 символами
          if len(description) > 3800:
              description = description[:3800] + "\n..."

          commit_message = os.environ["COMMIT_MESSAGE"].splitlines()[0]

          payload = {
              "username": "GitHub Changelog",
              "embeds": [
                  {
                      "title": "🚀 New commit",
                      "description": (
                          f"**{commit_message}**\n\n"
                          f"📁 **Changes**\n\n"
                          f"{description}"
                      ),
                      "url": os.environ["COMMIT_URL"],
                      "fields": [
                          {
                              "name": "Author",
                              "value": os.environ["COMMIT_AUTHOR"],
                              "inline": True
                          },
                          {
                              "name": "Branch",
                              "value": os.environ["BRANCH"],
                              "inline": True
                          },
                          {
                              "name": "Commit",
                              "value": f"`{os.environ['COMMIT_SHA'][:7]}`",
                              "inline": True
                          }
                      ],
                      "footer": {
                          "text": "GitHub Changelog"
                      }
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(f"Discord response: {response.status}")
          PY
